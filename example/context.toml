# ─────────────────────────────────────────────────────────────────────────────
# ADDING A DATASET is one `[[datasets]]` block and one `[[variables]]` block per
# column you want to talk about. RELATING TWO is one `[[relationships]]` block.
# Nothing else in the project changes.
#
# The two things that could go wrong quietly are handled at load time, before
# any claim is checked:
#
#   a manually imported file that changed  ->  the run stops
#   a join on a key with duplicates        ->  the relationship is refused
# ─────────────────────────────────────────────────────────────────────────────

[project]
name = "mace_vs_affinity"
title = "MACE interaction energies against manually imported experimental affinity"

# ── DATASET 1: computed here ─────────────────────────────────────────────────
# A rule in the Snakefile produces it, so Snakemake already holds its digest,
# the code that made it, the environment and the times. Nothing more is needed
# and nothing more is declared.
[[datasets]]
id = "mace"
origin = "computed"
files = ["data/mace_energies.csv"]
title = "MACE-OFF pocket-ligand interaction energies"
resampling_unit = "compound_group"

# ── DATASET 2: put here by a person ──────────────────────────────────────────
# NO RULE MADE THIS, so Snakemake knows nothing about it — not where it came
# from, not when, not whether the copy on disk is the one anybody looked at.
# `source`, `retrieved` and `sha256` are therefore REQUIRED, and the digest is
# checked on every single run.
#
# Replace the file with a newer export and the run stops with both digests
# printed. That is deliberately a hard error and not a warning: a warning about
# a silently changed input is one people read after they have published.
#
# To update it on purpose: put the new file in place, run the workflow, copy the
# `actual` digest out of the error into the line below, and say in the commit
# what changed.
[[datasets]]
id = "affinity"
origin = "manual"
files = ["data/experimental_affinity.csv"]
title = "Measured binding affinities as pKD"
source = "Exported by hand from the project's curated affinity table, 2026-08-15"
retrieved = "2026-08-15"
sha256 = "b1dc99b64502928fbe4c83c70a8cb331721016f2ff81d1bd1977e7f5e0c48628"

# ── VARIABLES ────────────────────────────────────────────────────────────────
# Each names its dataset, so `mace.e_int_kcal` is never confused with a column
# of the same name somewhere else. Units are UDUNITS-2; omit the key entirely if
# nobody has declared one, and any claim touching it returns `unverifiable`.

[[variables]]
dataset = "mace"
name = "e_int_kcal"
unit = "kcal/mol"
description = "MACE-OFF interaction energy. Converted from eV by the prepare rule."

[[variables]]
dataset = "mace"
name = "n_lig_atoms"
unit = "1"
description = "Ligand heavy-atom count — the obvious size confound."

[[variables]]
dataset = "affinity"
name = "experimental_pKD"
unit = "1"
description = "Measured affinity as pKD. Dimensionless: it is a log ratio."

# ── RELATIONSHIPS ────────────────────────────────────────────────────────────

# ACROSS THE TWO DATASETS, so it needs a join key. The key must identify a row
# on both sides; duplicates are refused rather than resolved, because joining
# ten rows to ten rows on a shared key makes a hundred pairs and none of them
# was ever measured.
[[relationships]]
x = "mace.e_int_kcal"
y = "affinity.experimental_pKD"
join = "complex_name"
kind = "correlation"
method = "pearson"
claimed = -0.5
[relationships.evidence]
source = "the premise of MACE triage: interaction energy ranks affinity well enough to spend the free-energy budget on the top slice"
locator = "example/context.toml#relationship-1"
extracted_by = "human"

# WITHIN ONE DATASET, so no join key is needed. This is the control, and it
# matters more than the claim above: if the energy tracks ligand SIZE more
# tightly than it tracks affinity, triaging on it selects big molecules.
[[relationships]]
x = "mace.e_int_kcal"
y = "mace.n_lig_atoms"
kind = "correlation"
method = "pearson"
claimed = 0.0
[relationships.evidence]
source = "the assumption the triage rests on: the energy measures interaction, not size"
locator = "example/context.toml#relationship-2"
extracted_by = "human"

# ── WHAT RESTS ON WHAT ───────────────────────────────────────────────────────
# The relationships above are checked one at a time. This is the part that says
# how they are connected, so that a refutation is news about more than the row
# it lands on.
#
#   python -m claimcheck.belief .          # what is now in doubt, and why
#
# A claim here is `subject --predicate--> object` with a status. `tested_by`
# names one of the relationships above, and then the RECOMPUTED verdict sets
# the status — `agrees` -> measured, `refuted` -> falsified, `unverifiable` ->
# untested. Writing a status beside `tested_by` is refused: a hand-written
# status that is about to be overwritten is still a status somebody will read.

[belief.rests_on]
# The name of something you will ask about later, and the node it rests on.
# Here they are the two dataset ids; a rule name or an output path works the
# same way.
mace = "mace_e_int"
affinity = "measured_affinity"

[[belief.nodes]]
id = "mace_e_int"
kind = "quantity"
label = "MACE-OFF interaction energy, evaluated on the docked pose"

[[belief.nodes]]
id = "interaction_strength"
kind = "quantity"
label = "The physical quantity the triage means to rank on"

[[belief.nodes]]
id = "measured_affinity"
kind = "reference"
label = "Binding affinity measured in the assay, as pKD"

[[belief.nodes]]
id = "docked_pose"
kind = "representation"
label = "The pose the energy is evaluated on"

[[belief.nodes]]
id = "crystal_pose"
kind = "reference"
label = "The pose the complex actually adopts"

[[belief.nodes]]
id = "vina_score"
kind = "method"
label = "The docking score this pipeline replaced"

# THE PREMISE OF THE TRIAGE. Its prediction is relationship 1, and the data
# agrees with it — so this claim is `measured`, and carries no caveat.
[[belief.claims]]
subject = "mace_e_int"
predicate = "preserves_ordering_of"
object = "measured_affinity"
tested_by = "mace.e_int_kcal ~ affinity.experimental_pKD"

# THE ASSUMPTION UNDERNEATH IT, and the reason the two questions are worth
# asking. A quantity that stands in for interaction strength predicts no
# relationship with ligand size — which is exactly what relationship 2 claims
# and exactly what the data refutes. So this claim is `falsified`, and every
# number from the `mace` dataset now carries it, INCLUDING the one whose own
# check came back `agrees`.
[[belief.claims]]
subject = "mace_e_int"
predicate = "approximates"
object = "interaction_strength"
tested_by = "mace.e_int_kcal ~ mace.n_lig_atoms"

# Two hops of provenance, neither of them checked by any relationship: the
# energy is evaluated on a pose, and the pose is a stand-in for the one the
# complex actually adopts. The second is `assumed`, so it is both an open
# question and a caveat, and it arrives on the `mace` dataset from two edges
# away.
[[belief.claims]]
subject = "mace_e_int"
predicate = "depends_on"
object = "docked_pose"
status = "by_construction"

[[belief.claims]]
subject = "docked_pose"
predicate = "approximates"
object = "crystal_pose"
status = "assumed"

# THE EDGE DOUBT MUST NOT CROSS, and the two-sided half of the example.
# `supersedes` records that a replacement happened and nothing more: the
# assumption still sitting on the score this pipeline replaced is not a caveat
# on the numbers that replaced it. Note that the claim below is the SAME
# predicate, against the SAME object, as the falsified one above — it is not
# delivered, and the only difference is whose numbers it is about.
[[belief.claims]]
subject = "mace_e_int"
predicate = "supersedes"
object = "vina_score"
status = "by_construction"

[[belief.claims]]
subject = "vina_score"
predicate = "approximates"
object = "interaction_strength"
status = "assumed"


# ---------------------------------------------------------------------------
# The jobs: why each run was launched, and what would have counted as success.
# ---------------------------------------------------------------------------
# Snakemake's store answers *what ran*. It has no slot for the question, for
# the outputs somebody said the run must produce, or for the verdict — and for
# work handed to a scheduler it holds nothing at all, because no rule ever ran
# locally. `claimcheck.jobs` publishes that half as PROV-O.
#
# The three records below are the three states worth telling apart, and the
# example carries all three on purpose:
#
#   dock-2026-08-04   adjudicated and passed: its declared output is confirmed,
#                     so it is the only one that reaches `prov:generated`.
#   score-2026-08-05  adjudicated and REFUTED. Its declared output stays on the
#                     plan under `dct:requires` and is NOT emitted as an entity
#                     that exists — publishing it would assert the presence of
#                     a file the check refused.
#   probe-2026-08-05  nothing declared to check. Not a failure. A job in this
#                     state cannot fail any check, and counting it beside the
#                     refuted one is how a list of real defects stops being read.
[jobs]
records = "jobs.jsonl"
agent = "example-cluster"
